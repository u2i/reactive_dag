name: publish

# release-please cuts the GitHub Release; publishing that release pushes the
# package (and its hexdocs) to hex.pm. NOTE: a release event runs the workflow
# file AT THE RELEASE TAG, so this only fires for tags that contain this file.
# workflow_dispatch is the manual escape hatch (publishes the checked-out ref).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace an existing release (hex allows this within 1h of publish)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hex-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix hex.publish --yes ${{ inputs.replace == true && '--replace' || '' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
